{{define "content"}}
<h1 class="title">{{if .IsEdit}}Edit Bookmark{{else}}New Bookmark{{end}}</h1>

<form
    method="POST"
    action="{{if .IsEdit}}/bookmarks/{{.Entry.ID}}{{else}}/bookmarks{{end}}"
>
    <div class="field">
        <label class="label" for="title">Title</label>
        <div class="control">
            <input
                class="input"
                type="text"
                id="title"
                name="title"
                value="{{if .IsEdit}}{{.Entry.Title}}{{end}}"
                required
            />
        </div>
    </div>

    <div class="field">
        <label class="label" for="tags">Tags</label>
        <div class="control">
            <input
                class="input"
                type="text"
                id="tags"
                name="tags"
                value="{{if .IsEdit}}{{range $i, $t := .Tags}}{{if $i}}, {{end}}{{$t.Name}}{{end}}{{end}}"
                placeholder="comma separated, e.g. work, thesis"
            />
        </div>
    </div>

    <div class="field is-grouped">
        <div class="control">
            <button type="submit" class="button is-primary">
                {{if .IsEdit}}Save{{else}}Create{{end}}
            </button>
        </div>
        <div class="control">
            <a href="/" class="button is-light">Cancel</a>
        </div>
    </div>
</form>

<p class="help mt-4">
    {{if .IsEdit}} Add URLs on the bookmark view page after saving. {{else}}
    After creating, you'll be able to add URLs to this bookmark. {{end}}
</p>
{{end}}
