{{define "content"}}
<h1>{{if .IsEdit}}Edit Bookmark{{else}}New Bookmark{{end}}</h1>
<form
    method="POST"
    action="{{if .IsEdit}}/bookmarks/{{.Entry.ID}}{{else}}/bookmarks{{end}}"
>
    <div>
        <label for="title">Title</label>
        <input
            type="text"
            id="title"
            name="title"
            value="{{if .IsEdit}}{{.Entry.Title}}{{end}}"
            required
        />
    </div>

    <div>
        <label for="tags">Tags</label>
        <input
            type="text"
            id="tags"
            name="tags"
            value="{{if .IsEdit}}{{range $i, $t := .Tags}}{{if $i}}, {{end}}{{$t.Name}}{{end}}{{end}}"
            placeholder="comma separated, e.g. work, thesis"
        />
    </div>

    <button type="submit">{{if .IsEdit}}Save{{else}}Create{{end}}</button>
</form>

{{if .IsEdit}}
<p>Add URLs on the bookmark view page after saving.</p>
{{else}}
<p>After creating, you'll be able to add URLs to this bookmark.</p>
{{end}}

<a href="/">Back to dashboard</a>
{{end}}
