{{define "bookmark-items"}}
<div class="block" id="bookmark-items">
    {{if .BookmarkItems}} {{range .BookmarkItems}}
    <div class="level is-mobile mb-3">
        <div class="level-left">
            <div>
                <a href="{{.URL}}" target="_blank" class="has-text-link"
                    >{{.URL}}</a
                >
                <div class="mt-1">
                    {{if .LastCheckedAt}} {{if .LastStatus}}
                    <span class="tag is-success is-light">{{.LastStatus}}</span>
                    {{else}}
                    <span class="tag is-danger is-light">Failed</span>
                    {{end}}
                    <span class="is-size-7 has-text-grey ml-1">
                        {{.LastCheckedAt.Format "2 Jan 15:04"}}
                    </span>
                    {{else}}
                    <span class="tag is-warning is-light">Not checked</span>
                    {{end}}
                </div>
            </div>
        </div>
        <div class="level-right">
            <button
                class="button is-small is-danger is-light"
                hx-post="/bookmarks/{{$.EntryID}}/items/{{.ID}}/delete"
                hx-target="#bookmark-items"
                hx-swap="outerHTML"
                hx-confirm="Are you sure you want to delete this link?"
            >
                ✕
            </button>
        </div>
    </div>
    {{end}} {{else}}
    <p class="has-text-grey">No URLs yet. Add one below.</p>
    {{end}}
</div>
{{end}}
