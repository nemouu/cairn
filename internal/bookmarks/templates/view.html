{{define "content"}}
<div class="columns is-centered">
    <div class="column is-8-desktop is-10-tablet">
        <article class="box">
            {{template "entry-header" (dict "Entry" .Entry "Tags" .Tags "Actions" true)}}

            <h2 class="subtitle is-6 has-text-grey-light mb-4">LINKS</h2>

            {{template "bookmark-items" .}}

            <!-- Add URL form -->
            <div class="mt-5">
                <form
                    hx-post="/bookmarks/{{.Entry.ID}}/items"
                    hx-target="#bookmark-items"
                    hx-swap="outerHTML"
                    hx-on::after-request="if(event.detail.successful) this.reset()"
                    class="field has-addons"
                >
                    <div class="control is-expanded">
                        <input
                            class="input is-shadowless"
                            type="url"
                            name="url"
                            placeholder="Add a new URL (https://...)"
                            required
                            style="
                                background-color: var(--bulma-scheme-main-ter);
                                border: none;
                            "
                        />
                    </div>
                    <div class="control">
                        <button type="submit" class="button is-light">
                            <span class="icon">
                                {{template "icon-plus" (dict "size" 18)}}
                            </span>
                            <span>Add</span>
                        </button>
                    </div>
                </form>
            </div>

            {{template "entry-footer" .}}
        </article>
    </div>
</div>
{{end}}

{{define "entry-header-actions"}}
<button
    class="button is-ghost has-text-grey-light p-0 check-action-trigger"
    hx-post="/bookmarks/{{.Entry.ID}}/check"
    hx-target="#bookmark-items"
    hx-swap="outerHTML"
    hx-disabled-elt="this"
    hx-indicator="#check-indicator"
    title="Check all links status"
    style="text-decoration: none"
>
    <span class="icon">
        {{template "icon-refresh" (dict "size" 18)}}
    </span>
</button>
<span id="check-indicator" class="htmx-indicator ml-1">⏳</span>
{{end}}
