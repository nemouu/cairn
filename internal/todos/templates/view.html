{{define "content"}}
<div class="columns is-centered">
    <div class="column is-8-desktop is-10-tablet">
        <article class="box">
            <div class="level">
                <div class="level-left">
                    <h1 class="title">{{.Entry.Title}}</h1>
                </div>
                <div class="level-right">
                    <time class="is-size-7 has-text-grey">
                        {{.Entry.UpdatedAt.Format "2 Jan 2006, 15:04"}}
                    </time>
                </div>
            </div>

            <div class="mb-5">
                {{if .Tags}}
                <div class="tags mb-3">
                    {{range .Tags}}
                    <a href="/tags/{{.Name}}" class="tag is-light">{{.Name}}</a>
                    {{end}}
                </div>
                {{end}}
            </div>

            <!-- Todo items -->
            {{template "todo-items" .}}

            <!-- Add item -->
            <div class="mt-5">
                <form
                    hx-post="/todos/{{.Entry.ID}}/items"
                    hx-target="#todo-items"
                    hx-swap="outerHTML"
                    hx-on::after-request="if(event.detail.successful) this.reset()"
                    class="field has-addons"
                >
                    <div class="control is-expanded">
                        <input
                            class="input is-shadowless"
                            type="text"
                            name="body"
                            placeholder="Add a new task..."
                            required
                            style="background-color: var(--bulma-scheme-main-ter); border: none;"
                        />
                    </div>
                    <div class="control">
                        <button type="submit" class="button is-light">
                            <span class="icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                            </span>
                            <span>Add</span>
                        </button>
                    </div>
                </form>
            </div>

            <footer class="entry-view-footer">
                <div class="level is-mobile">
                    <div class="level-left">
                        <a href="/" class="button is-ghost has-text-grey p-0" style="text-decoration: none;">
                            <span class="icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                            </span>
                            <span>Back to Dashboard</span>
                        </a>
                    </div>
                    <div class="level-right">
                        <div class="buttons">
                            <a href="/todos/{{.Entry.ID}}/edit" class="button is-light is-info-light">
                                <span class="icon is-small">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                                </span>
                                <span>Edit</span>
                            </a>
                            <form method="POST" action="/todos/{{.Entry.ID}}/delete" onsubmit="return confirm('Are you sure you want to delete this list?')">
                                <button type="submit" class="button is-light is-danger-light">
                                    <span class="icon is-small">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                                    </span>
                                    <span>Delete</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </footer>
        </article>
    </div>
</div>
{{end}}
