{{define "todo-items"}}
<div
    class="block"
    id="todo-items"
    x-data="{
        total: {{len .Todo}},
        done: {{range .Todo}}{{if .IsDone}}1 + {{end}}{{end}}0
    }"
>
    <!-- Progress Indicator - Only show if there are items -->
    <template x-if="total > 0">
        <div class="mb-5">
            <div class="is-flex is-justify-content-space-between is-align-items-center mb-2">
                <span class="is-size-7 has-text-grey-light">PROGRESS</span>
                <span
                    class="is-size-7 has-text-grey-light"
                    x-text="`${Math.round((done/total) * 100) || 0}%` "
                ></span>
            </div>
            <progress
                class="progress is-primary is-small"
                :value="done"
                :max="total"
                x-text="`${(done/total) * 100}%`"
            ></progress>
        </div>
    </template>

    {{range .Todo}}
    <div class="level is-mobile todo-item-row mb-1">
        <div class="level-left">
            <button
                class="button todo-checkbox p-0 {{if .IsDone}}is-done{{end}}"
                hx-post="/todos/{{$.Entry.ID}}/items/{{.ID}}/toggle"
                hx-target="#todo-items"
                hx-swap="outerHTML"
                title="{{if .IsDone}}Mark as incomplete{{else}}Mark as complete{{end}}"
            >
                <span class="icon">
                    {{if .IsDone}}
                        {{template "icon-check-circle" (dict "size" 20)}}
                    {{else}}
                        {{template "icon-circle" (dict "size" 20)}}
                    {{end}}
                </span>
            </button>
            <span class="todo-body-text ml-2 {{if .IsDone}}is-done{{end}}">
                {{.Body}}
            </span>
        </div>
        <div class="level-right" x-data="{ confirming: false }">
            <button
                type="button"
                x-show="!confirming"
                @click="confirming = true; setTimeout(() => confirming = false, 3000)"
                class="button is-ghost is-small has-text-grey-light p-0 delete-action-trigger"
                title="Delete item"
            >
                <span class="icon is-small">
                    {{template "icon-trash" (dict "size" 14)}}
                </span>
            </button>

            <button
                type="button"
                x-show="confirming"
                x-cloak
                hx-post="/todos/{{$.Entry.ID}}/items/{{.ID}}/delete"
                hx-target="#todo-items"
                hx-swap="outerHTML"
                class="button is-danger is-small py-0 px-2"
                style="height: 1.5rem"
            >
                <span class="is-size-7">Confirm?</span>
            </button>
        </div>
    </div>
    {{else}}
    <p class="has-text-grey-light is-italic py-4 has-text-centered">
        No items yet. Add one below!
    </p>
    {{end}}
</div>
{{end}}
