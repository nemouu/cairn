{{define "todo-items"}}
<div class="block" id="todo-items">
    {{range .Todo}}
    <div class="level is-mobile mb-2">
        <div class="level-left">
            <button
                class="button is-small is-light mr-2"
                hx-post="/todos/{{$.Entry.ID}}/items/{{.ID}}/toggle"
                hx-target="#todo-items"
                hx-swap="outerHTML"
            >
                {{if .IsDone}}☑{{else}}☐{{end}}
            </button>
            <span
                class="{{if .IsDone}}has-text-grey-light{{end}}"
                style="{{if .IsDone}}text-decoration: line-through{{end}}"
            >
                {{.Body}}
            </span>
        </div>
        <div class="level-right">
            <button
                class="button is-small is-danger is-light"
                hx-post="/todos/{{$.Entry.ID}}/items/{{.ID}}/delete"
                hx-target="#todo-items"
                hx-swap="outerHTML"
                hx-confirm="Are you sure you want to delete this item?"
            >
                ✕
            </button>
        </div>
    </div>
    {{end}}
</div>
{{end}}
