{{define "note-body"}}
<div 
    id="note-body-container"
    x-data="{ 
        editing: false, 
        content: `{{.Note.Body}}`,
        rendered: '',
        render() {
            this.rendered = marked.parse(this.content || '*No content yet...*');
        },
        save() {
            this.editing = false;
            this.render();
            // Use htmx to save to the server
            htmx.ajax('POST', '/notes/{{.Entry.ID}}/body', {
                values: { body: this.content },
                target: '#note-body-container',
                swap: 'none'
            });
        }
    }" 
    x-init="render()"
    class="block"
>
    <!-- View Mode -->
    <div 
        x-show="!editing" 
        @click="editing = true; $nextTick(() => $refs.editor.focus())"
        class="content p-4 is-clickable note-render-area"
        x-html="rendered"
    >
    </div>

    <!-- Edit Mode -->
    <div x-show="editing" x-cloak class="field">
        <div class="control">
            <textarea 
                x-ref="editor"
                class="textarea is-family-code" 
                x-model="content"
                rows="12"
                @keydown.escape="editing = false; render()"
                @keydown.ctrl.enter="save()"
                @blur="save()"
                placeholder="Write some markdown..."
            ></textarea>
        </div>
        <p class="help has-text-grey">
            Esc to cancel • Ctrl+Enter or click away to save • Markdown supported
        </p>
    </div>
</div>
{{end}}
