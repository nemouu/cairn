{{define "content"}}
<div class="columns is-centered">
    <div class="column is-8-desktop is-10-tablet">
        <div class="box">
            <h1 class="title">
                {{if .IsEdit}}Edit Note{{else}}New Note{{end}}
            </h1>

            <form
                method="POST"
                action="{{if .IsEdit}}/notes/{{.Entry.ID}}{{else}}/notes{{end}}"
            >
                <div class="field">
                    <label class="label" for="title">Title</label>
                    <div class="control">
                        <input
                            class="input is-shadowless input-minimal"
                            type="text"
                            id="title"
                            name="title"
                            value="{{if .IsEdit}}{{.Entry.Title}}{{end}}"
                            required
                        />
                    </div>
                </div>

                <div class="field">
                    <label class="label" for="tags">Tags</label>
                    <div class="control">
                        <input
                            class="input is-shadowless input-minimal"
                            type="text"
                            id="tags"
                            name="tags"
                            value="{{if .IsEdit}}{{range $i, $t := .Tags}}{{if $i}}, {{end}}{{$t.Name}}{{end}}{{end}}"
                            placeholder="comma separated, e.g. work, thesis"
                        />
                    </div>
                </div>

                <div class="field">
                    <label class="label" for="body">Body</label>
                    <div class="control">
                        <textarea
                            class="textarea is-shadowless textarea-minimal"
                            id="body"
                            name="body"
                            rows="10"
                        >
{{if .IsEdit}}{{.Note.Body}}{{end}}</textarea
                        >
                    </div>
                </div>

                <div class="field is-grouped">
                    <div class="control">
                        <button type="submit" class="button is-primary">
                            {{if .IsEdit}}Save{{else}}Create{{end}}
                        </button>
                    </div>
                    <div class="control">
                        <a href="/" class="button is-light">Cancel</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{{end}}
