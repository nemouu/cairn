{{define "content"}}
<!-- Page title: Changes based on whether the form is for editing or creating a note -->
<h1>{{if .IsEdit}}Edit Note{{else}}New Note{{end}}</h1>

<!-- Form submission: POSTs to either the edit or create endpoint based on mode -->
<form
    method="POST"
    action="{{if .IsEdit}}/notes/{{.Entry.ID}}{{else}}/notes{{end}}"
>
    <!-- Title field: Required for all notes -->
    <div>
        <label for="title">Title</label>
        <input
            type="text"
            id="title"
            name="title"
            value="{{if .IsEdit}}{{.Entry.Title}}{{end}}"
            required
        />
    </div>

    <!-- Tags field: Comma-separated list, pre-filled in edit mode -->
    <div>
        <label for="tags">Tags</label>
        <input
            type="text"
            id="tags"
            name="tags"
            value="{{if .IsEdit}}{{range $i, $t := .Tags}}{{if $i}}, {{end}}{{$t.Name}}{{end}}{{end}}"
            placeholder="comma separated, e.g. work, thesis"
        />
    </div>

    <!-- Body field: Multi-line textarea for note content -->
    <div>
        <label for="body">Body</label>
        <textarea id="body" name="body" rows="10">
{{if .IsEdit}}{{.Note.Body}}{{end}}</textarea
        >
    </div>

    <!-- Submit button: Text changes based on mode (Create/Save) -->
    <button type="submit">{{if .IsEdit}}Save{{else}}Create{{end}}</button>
</form>

<!-- Link to return to the dashboard -->
<a href="/">Back to dashboard</a>
{{end}}
