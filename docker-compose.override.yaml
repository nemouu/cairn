services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: cairn
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://cairn:cairn@db:5432/cairn?sslmode=disable
    depends_on:
      - db
    volumes:
      - ./static:/app/static
      - ./templates:/app/templates
volumes:
  pgdata:
