{{define "content"}}
<h1>Your entries</h1>
{{if .Entries}}
<div class="entry-grid">
    {{range .Entries}}
    <div class="entry">
        <div class="entry-header">
            <a href="/{{.EntryType}}s/{{.ID}}">{{.Title}}</a>
            <span class="badge badge-{{.EntryType}}">{{.EntryType}}</span>
        </div>

        {{$tags := index $.EntryTags .ID}} {{if $tags}}
        <div class="tags">
            {{range $tags}}
            <a href="/tags/{{.Name}}">{{.Name}}</a>
            {{end}}
        </div>
        {{end}}

        <time>{{.UpdatedAt.Format "2 Jan 2006"}}</time>
    </div>
    {{end}}
</div>
{{else}}
<p>No entries yet. Click + to create one.</p>
{{end}} {{end}}
