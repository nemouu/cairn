{{define "delete-button"}}
<div x-data="{ confirming: false }" class="{{.Class}}">
    {{if .HTMX}}
        <button
            type="button"
            x-show="!confirming"
            @click="confirming = true; setTimeout(() => confirming = false, 3000)"
            class="button {{or .ButtonClass "is-ghost text-grey-light p-0 delete-action-trigger"}} {{if .Small}}is-small{{end}}"
            title="{{or .Title "Delete"}}"
        >
            <span class="icon {{if .Small}}is-small{{end}}">
                {{template "icon-trash" (dict "size" (or .IconSize 14))}}
            </span>
            {{if .Label}}<span>{{.Label}}</span>{{end}}
        </button>
        <button
            type="button"
            x-show="confirming"
            x-cloak
            hx-post="{{.URL}}"
            hx-target="{{.Target}}"
            hx-swap="{{or .Swap "outerHTML"}}"
            class="button is-danger {{if .Small}}is-small py-0 px-2 h-1-5{{end}}"
        >
            <span class="{{if .Small}}is-size-7{{end}}">{{or .ConfirmLabel "Confirm?"}}</span>
        </button>
    {{else}}
        <button
            type="button"
            x-show="!confirming"
            @click="confirming = true; setTimeout(() => confirming = false, 3000)"
            class="button {{or .ButtonClass "is-light is-danger-light"}}"
        >
            <span class="icon is-small">
                {{template "icon-trash" (dict "size" 16)}}
            </span>
            <span>Delete</span>
        </button>
        <form
            method="POST"
            action="{{.URL}}"
            x-show="confirming"
            x-cloak
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100"
        >
            <button type="submit" class="button is-danger">
                <span class="icon is-small">
                    {{template "icon-trash" (dict "size" 16)}}
                </span>
                <span>Confirm Delete?</span>
            </button>
        </form>
    {{end}}
</div>
{{end}}
