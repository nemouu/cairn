<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{.Title}} – Cairn</title>
        <link rel="stylesheet" href="/static/bulma.min.css" />
        <link rel="stylesheet" href="/static/cairn.css" />
        <script src="/static/htmx.min.js"></script>
        <script src="/static/alpine.min.js" defer></script>
    </head>
    <body
        x-data="{ 
            theme: localStorage.getItem('theme') || 'system',
            applyTheme() {
                document.documentElement.classList.remove('theme-light', 'theme-dark');
                if (this.theme === 'light') {
                    document.documentElement.classList.add('theme-light');
                } else if (this.theme === 'dark') {
                    document.documentElement.classList.add('theme-dark');
                }
                localStorage.setItem('theme', this.theme);
            },
            toggleTheme() {
                if (this.theme === 'system') this.theme = 'light';
                else if (this.theme === 'light') this.theme = 'dark';
                else this.theme = 'system';
                this.applyTheme();
            }
        }"
        x-init="applyTheme()"
        @keydown.window.prevent.alt.s="$refs.searchInput.focus(); $refs.searchInput.setSelectionRange($refs.searchInput.value.length, $refs.searchInput.value.length)"
    >
        <nav class="navbar px-4" role="navigation" aria-label="main navigation">
            <div class="container">
                <div class="navbar-brand">
                    <a class="navbar-item" href="/">
                        <img src="/static/logo.png" alt="Cairn Logo" />
                    </a>
                </div>
                <div class="navbar-menu is-active">
                    <div class="navbar-start" style="flex-grow: 1">
                        <div class="navbar-item" style="flex-grow: 1">
                            <form
                                method="GET"
                                action="/"
                                class="navbar-search"
                                style="width: 50%; margin: 0 auto"
                            >
                                <div style="position: relative">
                                    <input
                                        class="input"
                                        type="text"
                                        name="q"
                                        placeholder="Search... (alt+s)"
                                        x-ref="searchInput"
                                        value="{{.Query}}"
                                        hx-get="/"
                                        hx-trigger="keyup changed delay:500ms, search"
                                        hx-target="#entry-list"
                                        hx-swap="outerHTML"
                                        hx-push-url="true"
                                    />
                                    {{if .Query}}
                                    <a
                                        href="/"
                                        hx-get="/"
                                        hx-target="#entry-list"
                                        hx-swap="outerHTML"
                                        hx-push-url="true"
                                        @click="$el.closest('form').querySelector('input').value = ''"
                                        style="
                                            position: absolute;
                                            right: 2.5rem;
                                            top: 50%;
                                            transform: translateY(-50%);
                                            color: #8b7d6b;
                                        "
                                        >✕</a
                                    >
                                    {{end}}
                                    <button type="submit" class="search-button">
                                        <svg
                                            xmlns="http://www.w3.org/2000/svg"
                                            width="18"
                                            height="18"
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="2"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                        >
                                            <circle
                                                cx="11"
                                                cy="11"
                                                r="8"
                                            ></circle>
                                            <path d="m21 21-4.35-4.35"></path>
                                        </svg>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="navbar-end">
                        <div class="navbar-item">
                            <div 
                                class="theme-slider" 
                                :data-theme="theme"
                            >
                                <div class="theme-slider-thumb"></div>
                                <div 
                                    class="theme-slider-option" 
                                    :class="{ 'is-active': theme === 'system' }"
                                    @click="theme = 'system'; applyTheme()"
                                    title="System theme"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                                </div>
                                <div 
                                    class="theme-slider-option" 
                                    :class="{ 'is-active': theme === 'light' }"
                                    @click="theme = 'light'; applyTheme()"
                                    title="Light theme"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                                </div>
                                <div 
                                    class="theme-slider-option" 
                                    :class="{ 'is-active': theme === 'dark' }"
                                    @click="theme = 'dark'; applyTheme()"
                                    title="Dark theme"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                                </div>
                            </div>
                        </div>
                        <div class="navbar-item">
                            <div x-data="{ open: false }" class="is-relative">
                                <button
                                    class="add-button"
                                    @click="open = !open"
                                >
                                    +
                                </button>
                                <div
                                    x-show="open"
                                    x-transition:enter="transition-all ease-out duration-200"
                                    x-transition:enter-start="opacity-0 transform scale-95"
                                    x-transition:enter-end="opacity-100 transform scale-100"
                                    x-transition:leave="transition-all ease-in duration-100"
                                    x-transition:leave-start="opacity-100 transform scale-100"
                                    x-transition:leave-end="opacity-0 transform scale-95"
                                    @click.outside="open = false"
                                    class="box"
                                    style="
                                        position: absolute;
                                        right: 0;
                                        top: 120%;
                                        min-width: 150px;
                                        padding: 0.5rem;
                                        z-index: 100;
                                        background: #3a3733;
                                        border: 1px solid #4a4540;
                                    "
                                >
                                    <a class="navbar-item" href="/notes/new"
                                        >Note</a
                                    >
                                    <a class="navbar-item" href="/bookmarks/new"
                                        >Bookmark</a
                                    >
                                    <a class="navbar-item" href="/todos/new"
                                        >Todo List</a
                                    >
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
        <main class="section">
            <div class="container">{{template "content" .}}</div>
        </main>

    </body>
</html>
