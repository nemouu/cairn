<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{.Title}} – Cairn</title>
        <link rel="stylesheet" href="/static/bulma.min.css" />
        <link rel="stylesheet" href="/static/cairn.css" />
        <script src="/static/htmx.min.js"></script>
        <script src="/static/alpine.min.js" defer></script>
    </head>
    <body>
        <nav class="navbar" role="navigation" aria-label="main navigation">
            <div class="navbar-brand">
                <a class="navbar-item" href="/">
                    <img src="/static/logo.png" alt="Cairn Logo" />
                </a>
            </div>
            <div class="navbar-end">
                <div class="navbar-item">
                    <div x-data="{ open: false }" class="is-relative">
                        <button class="button is-primary" @click="open = !open">
                            + New Entry
                        </button>
                        <div
                            x-show="open"
                            @click.outside="open = false"
                            class="box"
                            style="
                                position: absolute;
                                right: 0;
                                top: 100%;
                                min-width: 150px;
                                padding: 0.5rem;
                                z-index: 100;
                            "
                        >
                            <a class="navbar-item" href="/notes/new">Note</a>
                            <a class="navbar-item" href="/bookmarks/new"
                                >Bookmark</a
                            >
                            <a class="navbar-item" href="/todos/new"
                                >Todo List</a
                            >
                        </div>
                    </div>
                </div>
            </div>
        </nav>
        <main class="section">
            <div class="container">{{template "content" .}}</div>
        </main>
    </body>
</html>
